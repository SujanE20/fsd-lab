<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef7ff);
            color: #222;
        }

        #content {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px 35px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        }

        li {
            margin: 8px 0;
            font-size: 1.05rem;
        }

        .btn {
            display: inline-block;
            margin: 8px 8px 8px 0;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .btn-primary {
            background: #4f46e5;
            color: #fff;
        }

        .one {
            margin-top: 18px;
            padding: 10px 12px;
            background: #f3f4f6;
            border-left: 4px solid #4f46e5;
            border-radius: 6px;
        }
    </style>
</head>
<body id="body">
   
    <div id="content">
        <ol id="li" >
            <li>react</li>
            <li>angular</li>
            <li>vue</li>
            <li>node.js</li>
            <li>express.js</li>
        </ol>
            <button type="submit" id="submit-btn" class="btn btn-primary">Submit</button>
            <button type="reset" id="reset-btn" class="btn btn-primary">Reset</button>
            <button type="button" id="click-btn" class="btn btn-primary">click</button>

            <p class="one" id="one">This is a simple paragraph.</p>
            <p class="one" id="two">This is another simple paragraph.</p>
            <p class="five" id="three">This is a third simple paragraph.</p>
            <p class="six" id="four">This is a fourth simple paragraph.</p>
    </div>
    <script>
        let a=document.getElementById("body");
        a.addEventListener("body",function(){
            triggerAlert("you clicked on the body");
        })

        let text=document.getElementById("body");
        text.addEventListener("click",function(){
            text.textContent="clicked!";
        })      

    </script>    
</body>
</html>
