<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Guessing Game</title>
</head>
<body>
    <p id="result"></p>
    <script>
        function randgen() {
            const num = Math.floor(Math.random() * 100) + 1;
            let guess;
            while (true) {
                guess = Number(prompt("Enter a number between 1 and 100"));
                if (guess < num) {
                    alert("Your guess is very low.");
                } else if (guess > num) {
                    alert("Your guess is very high.");
                } else {
                    alert("Hurray! Your guess is correct!");
                    break;
                }

                
            }
            if(confirm("play again")){
                randgen();
            }
            else{
                alert("Dhanyavahagalu ")
            }
        }

        randgen();
    </script>
</body>
</html>
